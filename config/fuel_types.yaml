# Canonical fuel / production types (silver.generation.fuel_type) and per-source mappings.
# Shared vocabulary for every market (PHASE_AB_PLAN.md B4b): a source code maps to
# exactly one canonical type; a code that isn't listed fails a blocking check
# (never defaults). Loaded by pipelines/atlas_pipelines/sources/fuels.py.
version: 1

canonical:
  coal: {storage: false}
  gas: {storage: false}
  oil: {storage: false}
  nuclear: {storage: false}
  hydro: {storage: false}
  wind: {storage: false}
  solar: {storage: false}
  geothermal: {storage: false}
  battery_storage: {storage: true}
  other_storage: {storage: true}     # storage of unknown technology
  other: {storage: false}

# Negative values: EIA-930 reports NET generation (output minus the plant's own use),
# so negatives occur. In the owner's saved samples (2026-11-26): SUN 108, OTH 70,
# UES 74, BAT 22, COL 12, OIL 8 negative hours. `negative: allowed` = expected by
# definition (storage charging); `warn` = recorded and counted, never blocked or fixed.
# Status assumed: the owner confirms whether any of these should block.
sources:
  eia930:
    # code: {fuel_type, negative, name as EIA labels it (type-name)}
    BAT: {fuel_type: battery_storage, negative: allowed, name: Battery storage}
    COL: {fuel_type: coal, negative: warn, name: Coal}
    GEO: {fuel_type: geothermal, negative: warn, name: Geothermal}
    NG:  {fuel_type: gas, negative: warn, name: Natural Gas}
    NUC: {fuel_type: nuclear, negative: warn, name: Nuclear}
    OIL: {fuel_type: oil, negative: warn, name: Petroleum}
    OTH: {fuel_type: other, negative: allowed, name: Other}
    SUN: {fuel_type: solar, negative: warn, name: Solar}
    UES: {fuel_type: other_storage, negative: allowed, name: Unknown energy storage}
    WAT: {fuel_type: hydro, negative: warn, name: Hydro}
    WND: {fuel_type: wind, negative: warn, name: Wind}
    # Codes seen so far are the 11 above (saved samples, CISO/ERCO/PJM). The full list
    # comes from EIA's fueltype facet (make fixture-eia saves it); any code not listed
    # here blocks until it's mapped or added to `unmapped` with a reason.
  # In EIA's full fueltype facet (owner's fixture run 2026-11-26) but not in any saved data of
  # our BAs. Listed = known and explained; if one appears in real data it still BLOCKS until
  # mapped (never defaults). Proposed mapping, for the owner to confirm:
  #   PS -> a new canonical `pumped_storage` (storage: true; also fits ENTSO-E B10)
  #   SNB -> solar, WNB -> wind (integrated battery reported with the plant)
  #   OES -> other_storage, UNK -> other
  eia930_unmapped:
    OES: "Other energy storage: not seen in our BAs' saved data; mapping to confirm"
    PS: "Pumped storage: not seen in our BAs' saved data; needs a canonical pumped_storage type (owner)"
    SNB: "Solar with integrated battery storage: not seen in our BAs' saved data; mapping to confirm"
    UNK: "Unknown: not seen in our BAs' saved data; mapping to confirm"
    WNB: "Wind with integrated battery storage: not seen in our BAs' saved data; mapping to confirm"
