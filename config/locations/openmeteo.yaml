# Weather points: one per covered zone (PHASE_AB_PLAN.md B4).
# STATUS: CONFIRMED by the owner 2026-11-27: a compromise point between each zone's wind and
# solar fleet (rationale and sources: docs/data/sources/openmeteo.md, "Locations"):
#   DE_LU Kassel: between the onshore-wind north (Lower Saxony, NRW, Schleswig-Holstein lead
#         additions) and the solar south (Bavaria leads), per Bundesnetzagentur/MaStR reporting;
#   ES    Ciudad Real (Castilla-La Mancha, the 2nd-largest renewable region, REE 2023), between
#         the Castilla y Leon wind/renewables lead and the Extremadura solar lead;
#   SE3   Orebro, central SE3 (SE3's solar fleet is small; its wind sits across the zone).
# A single point cannot represent both technologies well; two points per zone (wind, solar)
# was considered and declined for now. Coordinates are the town centres, WGS84 decimal
# degrees; Open-Meteo snaps them to its model grid.
