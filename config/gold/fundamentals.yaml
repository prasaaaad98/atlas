# Gold fundamentals definitions (slice E7). Loaded by pipelines/atlas_pipelines/gold/fundamentals.py.
# status proposed: the owner confirms (docs/data/gold.md), like the daily_spreads definitions.
version: 1
status: proposed

# Renewable = every canonical type whose group is listed (config/mappings/fuel_types.yaml,
# ADR-B09). Storage is its own group: it moves energy, it doesn't produce it. For EIA-930 this
# is wind, solar, hydro, geothermal (biomass/waste sit inside "other" there and can't be
# counted without guessing).
renewable_fuel_groups: [renewable]

# net_load = demand - solar - wind (PLAN_EIA_TRACK.md E7); wind = onshore + offshore.
solar_fuel_types: [solar]
wind_fuel_types: [wind_onshore, wind_offshore]
