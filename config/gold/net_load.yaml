# Gold net load and generation mix definitions (ADR-B10, ADR-B09). Loaded by
# pipelines/atlas_pipelines/gold/net_load.py. Confirmed by the owner 2026-11-27 (docs/data/gold.md):
# residual load = demand (ENTSO-E total load, as reported) - solar - wind; forecast side uses only
# vintages known by the start of the local day; a gap in any wind/solar series empties its
# intervals; a zone that never sends solar and isn't required for it subtracts 0.
version: 1
status: confirmed

# net_load = demand - solar - wind, per kind (actual, forecast) and interval.
# Declared inputs: demand, plus every generation-direction series of these types present that
# day, plus the zone's required types from the registry (entsoe.generation.required.forecast,
# used for both kinds: the wind/solar a zone reports). Missing at an interval -> null there.
solar_fuel_types: [solar]
wind_fuel_types: [wind_onshore, wind_offshore]
required_types_from: entsoe.generation.required.forecast
