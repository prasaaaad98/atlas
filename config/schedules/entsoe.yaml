# ENTSO-E load, generation and gold schedules (B4a/B4b, ADR-B10). Applied with:
#   python -m atlas_pipelines schedules apply config/schedules/entsoe.yaml
# Day-ahead prices have their own owner-run loop (make b7-schedule). Times are our operating
# choices, not claims about when ENTSO-E publishes. Late intervals (a series published with
# series_complete = false) are filled by the re-fetches: refetch_after_days d re-runs each
# partition once, d days after it ended, as a new vintage; gold re-runs after each.
# Point in time (§3.4a, owner 2026-11-27): load and generation run at 20:00 Brussels for
# TOMORROW (offset +1). Before the day starts the task fetches the day-ahead forecast only: the
# vintage gold may use. Actuals arrive with the re-fetches (+1 day = two evenings after the day,
# +2, +7), which also add later forecast vintages (kept, never used for the forecast view).
# Gold runs for the day before yesterday (offset -2) after the +1 re-fetch, and again after +2/+7.
version: 1
schedules:
  load_entsoe_daily:
    why: day-ahead load forecast for tomorrow, before the day (point in time); actuals and late intervals via the +1/+2/+7 re-fetches
    cron: "0 20 * * *"
    tz: Europe/Brussels
    offset_days: 1
    catchup: true
    start: 2026-11-28
    refetch_after_days: [1, 2, 7]
  generation_entsoe_daily:
    why: wind/solar day-ahead forecast for tomorrow, before the day; generation per type and late series via the +1/+2/+7 re-fetches (ADR-B10)
    cron: "15 20 * * *"
    tz: Europe/Brussels
    offset_days: 1
    catchup: true
    start: 2026-11-28
    refetch_after_days: [1, 2, 7]
  entsoe_gold_daily:
    why: gold net load + generation mix from silver only, after the +1 re-fetch brought the actuals; re-built after the +2/+7 re-fetches
    cron: "30 21 * * *"
    tz: Europe/Brussels
    offset_days: -2
    catchup: true
    start: 2026-11-28
    refetch_after_days: [2, 7]
