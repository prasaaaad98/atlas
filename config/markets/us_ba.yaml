# Market registry entry: US balancing authorities, fundamentals from EIA (Form EIA-930).
# Loaded by pipelines/atlas_pipelines/core/markets.py. Source terms: docs/data/sources/eia.md.
# EIA track plan: PLAN_EIA_TRACK.md (slices E0–E7).
#
# NO PRICES here: EIA-930 has demand, day-ahead demand forecast, net generation,
# generation by fuel and interchange. US prices wait for an ISO source (price_source).
#
# Partitions are UTC days (timezone: UTC). The plan's completeness rule is 24 hours
# per UTC day per BA, and the seven BAs span three local time zones. Each BA's local
# zone (below, `eia.bas.<code>.tz`) is used only for derived local date/hour columns,
# and both of its DST days are tested in E2/E3.
registry_version: 1
id: us_ba
name: US balancing authorities (EIA-930 fundamentals)
timezone: UTC
currency: USD          # no prices from this market today; required by the registry format
zones: [CISO, ERCO, PJM, MISO, NYIS, ISNE, SWPP]   # EIA respondent codes (PLAN_EIA_TRACK.md §3)
products:
  DEMAND:              # actual demand and day-ahead demand forecast (silver.demand, kind = actual|forecast)
    canonical_market: EIA930_DEMAND
    intervals:
      - {effective_from: 2022-04-01, minutes: 60}   # start of the history we backfill (plan §6 E6), hourly
    price_floor: null
    price_cap: null
  GENERATION:          # net generation by fuel (silver.generation)
    canonical_market: EIA930_GENERATION
    intervals:
      - {effective_from: 2022-04-01, minutes: 60}
    price_floor: null
    price_cap: null
  INTERCHANGE:         # net interchange (silver.interchange)
    canonical_market: EIA930_INTERCHANGE
    intervals:
      - {effective_from: 2022-04-01, minutes: 60}
    price_floor: null
    price_cap: null

# ---------------------------------------------------------------------------
# Adapter section: read and validated only by sources/eia/ (E1).
eia:
  # Per BA. `tz` drives derived local columns only. `verified` = matched against
  # EIA's own local-hourly offsets for every hour of a normal day and three DST days
  # (owner's fixture run 2026-11-26; test_local_hourly_offsets_match_the_registry_zone).
  # The others stay `assumed` until sampled (MISO: confirm Central prevailing time).
  # Note: EIA's local-hourly label carries the offset at the hour's END; our
  # local_date/local_hour use the hour's START (hour ending 01:00 … 24:00 convention).
  # price_source: none | caiso_oasis | pjm_dataminer | ercot_api (PLAN_EIA_TRACK.md §8).
  # backfill_start: our coverage choice (plan E6), not EIA's data start.
  bas:
    CISO: {name: California ISO, operator: CAISO, tz: America/Los_Angeles, tz_status: verified, price_source: none, price_source_status: "pending: CAISO OASIS reachability and terms (investigate only)", backfill_start: 2022-04-01}
    ERCO: {name: Electric Reliability Council of Texas, operator: ERCOT, tz: America/Chicago, tz_status: verified, price_source: none, price_source_status: "on hold: ERCOT API restricted outside the US", backfill_start: 2022-04-01}
    PJM:  {name: PJM Interconnection, operator: PJM, tz: America/New_York, tz_status: verified, price_source: none, price_source_status: "on hold: Data Miner needs an approved key; internal use only", backfill_start: 2022-04-01}
    MISO: {name: Midcontinent ISO, operator: MISO, tz: America/Chicago, tz_status: assumed, price_source: none, backfill_start: 2022-04-01}
    NYIS: {name: New York ISO, operator: NYISO, tz: America/New_York, tz_status: assumed, price_source: none, backfill_start: 2022-04-01}
    ISNE: {name: ISO New England, operator: ISO-NE, tz: America/New_York, tz_status: assumed, price_source: none, backfill_start: 2022-04-01}
    SWPP: {name: Southwest Power Pool, operator: SPP, tz: America/Chicago, tz_status: assumed, price_source: none, backfill_start: 2022-04-01}
  # Demand forecast point-in-time (plan §4, ADR-B06 addendum in E2): EIA-930 does
  # not publish when a BA issued its day-ahead forecast. Placeholder, to be set
  # with a cited basis in E2; until then backtests use fetched_at_utc only.
  forecast_availability: {rule: null, status: assumed}
  # EIA-930 timestamps are HOUR-ENDING: `period` T06 covers 05:00-06:00 UTC.
  # Sources: EIA, "About the EIA-930 data" (https://www.eia.gov/electricity/930-content/about.html):
  # "Hourly data are published using the hour ending time reporting convention"; Form EIA-930
  # instructions (2026-07-31 edition): "hour ending 1:00 AM Eastern Standard Time (with UTC Offset = 5)
  # should be reported as 2017-03-01T06:00:00.000Z".
  period_marks: {value: interval_end, status: sourced}
  # Net interchange sign (region-data type TI): positive = net exports. Measured on the saved
  # samples: demand = net generation - TI (ERCO exact; PJM within 3%; CISO median 2.5%, max 25%).
  # status sourced once EIA's definition is quoted in docs/data/sources/eia.md.
  interchange_sign: {positive_means: net_exports, status: assumed}
  # Our policy (not a source fact): EIA-930 values arrive with a lag and are revised. A UTC
  # day that ended less than this long ago and is incomplete is "not published yet"
  # (retryable); after it, missing hours are a blocking failure. Revisit with measurements.
  publication: {late_after_hours_from_day_end: 48}
  # Balance identity demand ≈ net generation − net interchange (warn only): tolerance as
  # a share of demand. Our choice; EIA-930 is self-reported and sometimes inconsistent.
  balance_tolerance: 0.05

# ---------------------------------------------------------------------------
# Calendar (B4e, sources/calendar/build.py). Local dates in each BA's zone (the
# market partitions by UTC); `tz` must equal eia.bas.<code>.tz (tested).
# Single-state BAs use that state's holidays (federal + state); multi-state BAs
# use federal holidays only. Status assumed: a choice for the owner to confirm.
calendar:
  weekend: [6, 7]
  zones:
    CISO: {country: US, subdivision: CA, tz: America/Los_Angeles, status: assumed}
    ERCO: {country: US, subdivision: TX, tz: America/Chicago, status: assumed}
    PJM:  {country: US, subdivision: null, tz: America/New_York, status: assumed}
    MISO: {country: US, subdivision: null, tz: America/Chicago, status: assumed}
    NYIS: {country: US, subdivision: NY, tz: America/New_York, status: assumed}
    ISNE: {country: US, subdivision: null, tz: America/New_York, status: assumed}
    SWPP: {country: US, subdivision: null, tz: America/Chicago, status: assumed}
